<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIC-TAC-TOE </title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" />
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Tic Tac Toe </h1>
    </header>
    <main class="container">
        <div class="game-status" id="game-status">start playing</div>
        <div class="tic-board">
            <div class="box" data-cell="0"></div>
            <div class="box" data-cell="1"></div>
            <div class="box" data-cell="2"></div>
            <div class="box" data-cell="3"></div>
            <div class="box" data-cell="4"></div>
            <div class="box" data-cell="5"></div>
            <div class="box" data-cell="6"></div>
            <div class="box" data-cell="7"></div>
            <div class="box" data-cell="8"></div>
        </div>
        <div class="controls">
            <button class="play-again" id="play-again">new game</button>
        </div>
    </main>
    <footer>
        <p>Developed by Abhishek Kumar</p>
        <p>GitHub: kumarabhishek19610-crypto</p>
    </footer>
</body>

</html>
